<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clozed MCQ Preview</title>
<style>
  :root { --page: #f3f3f1; --ink: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6; --panel: #fff; --accent: #3b5bdb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 12px; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  select, textarea { width: 100%; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: inherit; }
  textarea { min-height: 150px; resize: vertical; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .viewer { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .status { font-size: 12px; color: var(--muted); }
  iframe { width: 100%; height: 560px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  iframe.phone { width: 390px; max-width: 100%; height: 700px; align-self: center; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Clozed MCQ preview</h1>
    <p class="lead">Runs the built <code>front.html</code>, <code>back.html</code> and <code>styling.css</code> the way Anki desktop does: one page, card HTML swapped in, scripts re-run. Cloze HTML is simulated to match Anki's output.</p>
    <label for="note">Sample note</label>
    <select id="note"></select>
    <label for="text">Text</label>
    <textarea id="text" spellcheck="false"></textarea>
    <label for="extra">Back Extra</label>
    <textarea id="extra" spellcheck="false" style="min-height:60px"></textarea>
    <label for="more">Other fields, one per line as <code>Field name: html</code></label>
    <textarea id="more" spellcheck="false" style="min-height:90px"></textarea>
    <label for="tags">Tags</label>
    <textarea id="tags" spellcheck="false" style="min-height:34px"></textarea>
    <label for="ord">Card</label>
    <select id="ord"></select>
    <div class="row">
      <button class="primary" id="showFront">Front</button>
      <button id="showBack">Show answer</button>
    </div>
    <div class="row">
      <button id="night">Night mode</button>
      <button id="phone">Phone width</button>
    </div>
  </div>
  <div class="viewer">
    <div class="status" id="status"></div>
    <iframe id="anki" title="Card preview"></iframe>
  </div>
</div>

// ---- Cloze renderer (mirrors the HTML from Anki's rslib/src/cloze.rs) ----
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function parseNote(src) {
  const root = { kids: [] }, stack = [root];
  let i = 0, buf = '';
  const flush = () => { if (buf) { stack[stack.length - 1].kids.push(buf); buf = ''; } };
  while (i < src.length) {
    const m = src.slice(i).match(/^\{\{c(\d+(?:,\d+)*)::/);
    if (m) {
      flush();
      const node = { ords: m[1].split(',').map(Number), kids: [] };
      stack[stack.length - 1].kids.push(node); stack.push(node);
      i += m[0].length; continue;
    }
    if (src.startsWith('}}', i) && stack.length > 1) {
      flush();
      const node = stack.pop();
      // Anki splits the hint off the first text node at the first "::"
      if (typeof node.kids[0] === 'string') {
        const k = node.kids[0].indexOf('::');
        if (k >= 0) { node.hint = node.kids[0].slice(k + 2); node.kids[0] = node.kids[0].slice(0, k); }
      }
      i += 2; continue;
    }
    buf += src[i++];
  }
  flush();
  return root.kids;
}

function ordsOf(nodes, out = new Set()) {
  nodes.forEach(n => { if (typeof n !== 'string') { n.ords.forEach(o => out.add(o)); ordsOf(n.kids, out); } });
  return [...out].sort((a, b) => a - b);
}

function renderNodes(nodes, ord, question) {
  return nodes.map(n => typeof n === 'string' ? n : renderCloze(n, ord, question)).join('');
}

function renderCloze(n, ord, question) {
  const active = n.ords.includes(ord);
  const inner = renderNodes(n.kids, ord, question);
  if (active && question) return `<span class="cloze" data-cloze="${esc(inner)}" data-ordinal="${ord}">[${n.hint ?? '...'}]</span>`;
  if (active) return `<span class="cloze" data-ordinal="${ord}">${inner}</span>`;
  return `<span class="cloze-inactive" data-ordinal="${n.ords[0]}">${inner}</span>`;
}

// ---- Anki-style field substitution ----
function renderTemplate(tpl, fields, ord, question) {
  tpl = tpl.replace(/\{\{([#^])([^}]+)\}\}([\s\S]*?)\{\{\/\2\}\}/g, (_, kind, name, body) => {
    const filled = (fields[name.trim()] || '').trim() !== '';
    return (kind === '#') === filled ? body : '';
  });
  return tpl.replace(/\{\{([^}]+)\}\}/g, (_, ref) => {
    const m = ref.match(/^cloze:(.+)$/);
    if (m) return renderNodes(parseNote(fields[m[1].trim()] || ''), ord, question);
    const name = ref.trim();
    // Anki refuses a template that names a field the note type does not have
    if (!TEMPLATES.fields.includes(name) && name !== 'Tags') throw new Error(`Template names "${name}", which is not a field`);
    return fields[name] ?? '';
  });
}

// ---- The reviewer: one page, card HTML swapped in, scripts re-run, like Anki desktop ----
function mountReviewer(frame, onReady) {
  frame.srcdoc = `<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">
<style>${TEMPLATES.css}</style></head><body class="card"><div id="qa"></div>
<script>
window.py = {};   // Anki desktop exposes this; anki-persistence stores picks on it
window.setQA = function (html) {
  var qa = document.getElementById('qa');
  qa.innerHTML = html;
  qa.querySelectorAll('script').forEach(function (old) {
    var s = document.createElement('script');
    s.textContent = old.textContent;
    old.replaceWith(s);
  });
};
<\/script></body></html>`;
  frame.onload = onReady;
  return {
    show(fields, ord, question) {
      frame.contentWindow.setQA(renderTemplate(question ? TEMPLATES.front : TEMPLATES.back, fields, ord, question));
    },
    night(on) {
      frame.contentDocument.body.className = 'card' + (on ? ' nightMode night_mode' : '');
    },
  };
}

const frame = document.getElementById('anki');
let night = false;
const reviewer = mountReviewer(frame, () => { loadNote(); show(true); });

const $ = id => document.getElementById(id);
NOTES.forEach((n, i) => $('note').add(new Option(n.name, i)));

function loadNote() {
  const n = NOTES[+$('note').value];
  $('text').value = n.text;
  $('extra').value = n.extra;
  $('more').value = n.more || '';
  $('tags').value = n.tags || '';
  refreshOrds();
}

function refreshOrds() {
  const keep = $('ord').value;
  $('ord').innerHTML = '';
  ordsOf(parseNote($('text').value)).forEach(o => $('ord').add(new Option('Card ' + o + ' (c' + o + ')', o)));
  if ([...$('ord').options].some(o => o.value === keep)) $('ord').value = keep;
}

function show(question) {
  const fields = { 'Text': $('text').value, 'Back Extra': $('extra').value, 'Tags': $('tags').value };
  $('more').value.split('\n').forEach(line => {
    const at = line.indexOf(':');
    if (at > 0) fields[line.slice(0, at).trim()] = line.slice(at + 1).trim();
  });
  const unknown = Object.keys(fields).filter(f => f !== 'Tags' && !TEMPLATES.fields.includes(f));
  const ord = +$('ord').value;
  try {
    reviewer.show(fields, ord, question);
    $('status').textContent = (question ? 'Question' : 'Answer') + ' side, card ' + ord +
      (unknown.length ? '. Not fields of this note type: ' + unknown.join(', ') : '');
  } catch (err) {
    $('status').textContent = 'Anki would reject this template: ' + err.message;
  }
}

$('note').onchange = () => { loadNote(); show(true); };
$('text').oninput = refreshOrds;
$('ord').onchange = () => show(true);
$('showFront').onclick = () => show(true);
$('showBack').onclick = () => show(false);
$('night').onclick = () => { night = !night; reviewer.night(night); };
$('phone').onclick = () => frame.classList.toggle('phone');
</script>
</body>
</html>
