<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clozed MCQ Preview</title>
<style>
  :root { --page: #f3f3f1; --ink: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6; --panel: #fff; --accent: #3b5bdb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 12px; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  select, textarea { width: 100%; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: inherit; }
  textarea { min-height: 150px; resize: vertical; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .viewer { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .status { font-size: 12px; color: var(--muted); }
  iframe { width: 100%; height: 560px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  iframe.phone { width: 390px; max-width: 100%; height: 700px; align-self: center; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Clozed MCQ preview</h1>
    <p class="lead">Runs the built <code>front.html</code>, <code>back.html</code> and <code>styling.css</code> the way Anki desktop does: one page, card HTML swapped in, scripts re-run. Cloze HTML is simulated to match Anki's output.</p>
    <label for="note">Sample note</label>
    <select id="note"></select>
    <label for="text">Text</label>
    <textarea id="text" spellcheck="false"></textarea>
    <label for="extra">Back Extra</label>
    <textarea id="extra" spellcheck="false" style="min-height:60px"></textarea>
    <label for="more">Other fields, one per line as <code>Field name: html</code></label>
    <textarea id="more" spellcheck="false" style="min-height:90px"></textarea>
    <label for="tags">Tags</label>
    <textarea id="tags" spellcheck="false" style="min-height:34px"></textarea>
    <label for="ord">Card</label>
    <select id="ord"></select>
    <div class="row">
      <button class="primary" id="showFront">Front</button>
      <button id="showBack">Show answer</button>
    </div>
    <div class="row">
      <button id="night">Night mode</button>
      <button id="phone">Phone width</button>
    </div>
  </div>
  <div class="viewer">
    <div class="status" id="status"></div>
    <iframe id="anki" title="Card preview"></iframe>
  </div>
</div>

<script>
/* @TEMPLATES@ */

const NOTES = [
  { name: 'Single and nested blanks', extra: 'Rationale: metformin activates AMPK and lowers hepatic glucose output.',
    more: 'Lecture Notes: Biguanides are first-line unless eGFR is below 30. <a href="https://example.com/lecture">Lecture slides</a>\n' +
          'Missed Questions: Q42: confused metformin with sulfonylureas.\n' +
          'Pixorize: <a href="https://example.com/pixorize">Metformin mnemonic image</a>\n' +
          'Additional Resources: <a href="https://example.com/review">Review article</a>',
    tags: 'pharm::diabetes',
    text: '{{c1::Metformin;;Phenformin;;Buformin;;Glipizide}} is first-line for type 2 diabetes because it {{c2::reduces hepatic {{c3::gluconeogenesis;;glycogenolysis;;lipolysis;;ketogenesis}};;increases insulin release;;slows gastric emptying;;blocks renal glucose reabsorption}}.' },
  { name: 'Same number twice', extra: 'Net result: the cell interior becomes more negative.',
    text: 'The Na<sup>+</sup>/K<sup>+</sup> ATPase pumps 3 {{c1::Na+;;K+;;Ca2+;;Cl-}} out and 2 {{c1::K+;;Na+;;H+}} in per ATP.' },
  { name: 'No lists, sibling fallback', extra: '',
    text: 'Glycolysis: glucose is phosphorylated by {{c1::hexokinase}}, rearranged by {{c1::phosphoglucose isomerase}}, then committed by {{c1::phosphofructokinase-1}}.' },
  { name: 'Plain cloze (migrated note)', extra: 'Migrated notes look like this until you add distractors.',
    text: '{{c1::Canberra}} was founded in {{c2::1913}}.' },
  { name: 'Hint before the list', extra: '',
    text: '{{c1::Metformin::biguanide;;Phenformin;;Buformin;;Glipizide}} lowers hepatic glucose output.' },
  { name: 'Formatting and shared blank', extra: '',
    text: '<b>{{c1,2::Atropine;;Pilocarpine;;Neostigmine}}</b> is a {{c2::<i>muscarinic antagonist</i>;;nicotinic agonist;;cholinesterase inhibitor}}.' },
];

/* @ANKISIM@ */

const frame = document.getElementById('anki');
let night = false;
const reviewer = mountReviewer(frame, () => { loadNote(); show(true); });

const $ = id => document.getElementById(id);
NOTES.forEach((n, i) => $('note').add(new Option(n.name, i)));

function loadNote() {
  const n = NOTES[+$('note').value];
  $('text').value = n.text;
  $('extra').value = n.extra;
  $('more').value = n.more || '';
  $('tags').value = n.tags || '';
  refreshOrds();
}

function refreshOrds() {
  const keep = $('ord').value;
  $('ord').innerHTML = '';
  ordsOf(parseNote($('text').value)).forEach(o => $('ord').add(new Option('Card ' + o + ' (c' + o + ')', o)));
  if ([...$('ord').options].some(o => o.value === keep)) $('ord').value = keep;
}

function show(question) {
  const fields = { 'Text': $('text').value, 'Back Extra': $('extra').value, 'Tags': $('tags').value };
  $('more').value.split('\n').forEach(line => {
    const at = line.indexOf(':');
    if (at > 0) fields[line.slice(0, at).trim()] = line.slice(at + 1).trim();
  });
  const unknown = Object.keys(fields).filter(f => f !== 'Tags' && !TEMPLATES.fields.includes(f));
  const ord = +$('ord').value;
  try {
    reviewer.show(fields, ord, question);
    $('status').textContent = (question ? 'Question' : 'Answer') + ' side, card ' + ord +
      (unknown.length ? '. Not fields of this note type: ' + unknown.join(', ') : '');
  } catch (err) {
    $('status').textContent = 'Anki would reject this template: ' + err.message;
  }
}

$('note').onchange = () => { loadNote(); show(true); };
$('text').oninput = refreshOrds;
$('ord').onchange = () => show(true);
$('showFront').onclick = () => show(true);
$('showBack').onclick = () => show(false);
$('night').onclick = () => { night = !night; reviewer.night(night); };
$('phone').onclick = () => frame.classList.toggle('phone');
</script>
</body>
</html>
